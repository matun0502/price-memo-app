<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="価格メモ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <title>価格記録アプリ</title>
  <style>
    /* ページ全体の基本設定です */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: none;
    }

    /* スマホで読みやすい横幅にしています */
    .app {
      width: min(100%, 720px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      background: #ffffff;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: calc(16px + env(safe-area-inset-top)) 18px 14px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .quick-action-button {
      min-height: 48px;
      padding: 0 12px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #1e40af;
      font-size: 15px;
      font-weight: 800;
    }

    .lead {
      margin: 4px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    main {
      padding: 16px 16px calc(28px + env(safe-area-inset-bottom));
    }

    section {
      margin-bottom: 20px;
      scroll-margin-top: 132px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    form,
    .search-area {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 56px;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #111827;
      font-family: inherit;
      font-size: 16px;
    }

    input[type="checkbox"] {
      width: 24px;
      min-height: 24px;
      height: 24px;
      padding: 0;
      accent-color: #2563eb;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 10px 0;
      font-size: 16px;
      font-weight: 800;
    }

    .checkbox-row input {
      flex: 0 0 auto;
    }

    .sale-fields {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.24s ease;
    }

    .sale-fields.is-open {
      max-height: 260px;
    }

    .price-group {
      grid-column: 1 / -1;
      display: grid;
      gap: 14px;
      padding: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #f8fafc;
    }

    .price-group.sale-fields {
      gap: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      background: transparent;
    }

    .price-group.sale-fields.is-open {
      gap: 14px;
      padding: 14px;
      border-width: 1px;
      background: #f8fafc;
    }

    .price-group-title {
      margin: 0;
      color: #334155;
      font-size: 15px;
      font-weight: 800;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
      outline: 3px solid rgba(37, 99, 235, 0.18);
    }

    select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, #64748b 50%),
        linear-gradient(135deg, #64748b 50%, transparent 50%);
      background-position: calc(100% - 20px) 24px, calc(100% - 14px) 24px;
      background-repeat: no-repeat;
      background-size: 6px 6px, 6px 6px;
      padding-right: 42px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    button {
      min-height: 56px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: translateY(1px);
    }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #f8fafc;
      color: #475569;
      font-size: 14px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .list {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .item {
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      cursor: pointer;
    }

    .item-top {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 8px 10px;
    }

    .item-actions {
      display: flex;
      gap: 6px;
      order: -1;
    }

    .product-name {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      overflow-wrap: anywhere;
      flex: 1;
      min-width: 0;
    }

    .item-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      min-width: fit-content;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #047857;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .store-add-button {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .store-add-button:active {
      transform: translateY(1px);
    }

    .product-delete-button {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid #fecaca;
      border-radius: 999px;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .product-delete-button:active {
      transform: translateY(1px);
    }

    .readonly-field,
    .readonly-select {
      background: #f8fafc;
      color: #334155;
      cursor: default;
    }

    .readonly-select {
      pointer-events: none;
    }

    select:disabled {
      background: #f8fafc;
      color: #334155;
      opacity: 1;
    }

    .price {
      grid-row: 1 / 3;
      grid-column: 3;
      align-self: start;
      min-width: fit-content;
      color: #0f766e;
      font-size: 20px;
      font-weight: 800;
    }

    .price-block {
      display: grid;
      gap: 6px;
      align-self: start;
      justify-items: end;
      min-width: fit-content;
    }

    .price-line {
      color: #0f766e;
      font-size: 18px;
      font-weight: 800;
      white-space: nowrap;
    }

    .price-date {
      color: #64748b;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .old-price {
      color: #dc2626;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px 10px;
      margin: 10px 0 0;
      color: #475569;
      font-size: 14px;
    }

    .capacity-per-yen {
      grid-column: 1 / -1;
      margin-top: 4px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #eff6ff;
      color: #1d4ed8;
      font-weight: 800;
    }

    .store-list {
      display: grid;
      gap: 6px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease, margin-top 0.25s ease;
    }

    .item.is-expanded .store-list {
      max-height: 520px;
      margin-top: 10px;
    }

    .store-row {
      display: grid;
      grid-template-columns: 1fr auto auto;
      gap: 6px 10px;
      align-items: center;
      min-height: 44px;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: #f8fafc;
      color: #475569;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      text-align: left;
    }

    .store-row:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.4);
      outline-offset: 2px;
    }

    .store-price {
      color: #0f766e;
      font-weight: 800;
    }

    .store-delete-button {
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .store-delete-button:active {
      transform: translateY(1px);
    }

    .delete-button {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      background: #f1f5f9;
      color: #334155;
    }

    .detail-panel {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: flex-end;
      background: rgba(15, 23, 42, 0.45);
      padding: 18px;
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
    }

    .detail-panel.is-open {
      display: flex;
    }

    .detail-box {
      width: min(100%, 720px);
      max-height: min(88vh, 760px);
      margin: 0 auto;
      overflow: auto;
      border-radius: 8px;
      background: #ffffff;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.22);
    }

    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .detail-head h2 {
      margin: 0;
    }

    .close-button {
      width: 44px;
      min-height: 44px;
      border-radius: 8px;
      background: #f1f5f9;
      color: #334155;
      font-size: 22px;
      line-height: 1;
    }

    .edit-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .edit-actions button {
      width: 100%;
      min-height: 56px;
    }

    .detail-delete-button {
      border: 0;
      border-radius: 8px;
      background: #dc2626;
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .detail-delete-button:active {
      transform: translateY(1px);
    }

    .cancel-button {
      background: #f1f5f9;
      color: #334155;
    }

    .empty {
      padding: 24px 12px;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      color: #64748b;
      text-align: center;
    }

    /* 広い画面では入力欄だけ2列にして、スマホでは1列のまま使いやすくします */
    @media (min-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }

      .meta {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 430px) {
      header,
      main {
        padding-left: 14px;
        padding-right: 14px;
      }

      h1 {
        font-size: 20px;
      }

      .lead {
        font-size: 13px;
      }

      .summary {
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
      }

      .detail-panel {
        padding-left: 10px;
        padding-right: 10px;
      }

      .edit-actions {
        grid-template-columns: 1fr;
      }

      .item-top {
        flex-direction: column;
      }

      .item-actions {
        width: 100%;
        order: -1;
      }

      .item-controls {
        width: 100%;
        align-items: flex-start;
      }

    }

    @media (max-width: 390px) {
      .item {
        padding: 14px;
      }

      .item-top {
        grid-template-columns: auto 1fr;
      }

      .price {
        grid-row: auto;
        grid-column: 2;
        font-size: 19px;
      }

      .price-block {
        grid-row: auto;
        grid-column: 2;
        justify-items: start;
      }

      .category-badge {
        grid-column: 2;
      }
    }

    /* Accordion (mobile-first, minimal) */
    .accordion-section {
      border-radius: 8px;
      overflow: visible;
    }

    .accordion-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 58px;
      padding: 16px 18px;
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background 180ms ease, border-color 180ms ease;
    }

    .accordion-section.is-open .accordion-header {
      background: #dbeafe;
      border-color: #bfdbfe;
    }

    .accordion-header:focus {
      outline: 3px solid rgba(37,99,235,0.18);
      border-radius: 12px;
    }

    .accordion-content {
      overflow: hidden;
      max-height: 0;
      transition: max-height 260ms ease, padding 260ms ease;
      padding: 0 0;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-top: 0;
      border-radius: 0 0 12px 12px;
    }

    .accordion-indicator {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      margin-left: 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
      color: #334155;
      font-size: 22px;
      line-height: 1;
      transition: transform 200ms ease, background 180ms ease;
    }

    .accordion-section:not(.is-open) .accordion-indicator {
      transform: rotate(-90deg);
    }

    .accordion-content {
      overflow: hidden;
      max-height: 0;
      transition: max-height 260ms ease, padding 260ms ease;
      padding: 0 0;
    }

    .accordion-section.is-open .accordion-content {
      overflow: visible;
      padding-top: 12px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>価格記録アプリ</h1>
      <div class="quick-actions" aria-label="よく使う操作">
        <button class="quick-action-button" id="openSearchButton" type="button">検索を開く</button>
        <button class="quick-action-button" id="openFormButton" type="button">新規登録を開く</button>
      </div>
    </header>

    <main>
      <section class="accordion-section is-open" id="searchSection" aria-labelledby="list-title">
        <button class="accordion-header" aria-expanded="true" aria-controls="list-section-content">
          <span id="list-title">検索一覧表示</span>
          <span class="accordion-indicator">▾</span>
        </button>

        <div class="accordion-content" id="list-section-content">
          <div class="search-area">
            <div class="filter-row">
              <label>
                カテゴリで絞り込み
                <select id="categoryFilter">
                </select>
              </label>

              <label>
                商品名で検索
                <input id="productSearchInput" type="search" list="productNameOptions" autocomplete="off" placeholder="例: 洗剤">
              </label>

              <label>
                仕様で検索
                <input id="specSearchInput" type="search" list="specOptions" autocomplete="off" placeholder="例: 詰替">
              </label>

              <label>
                店舗で検索
                <input id="storeSearchInput" type="search" list="storeNameOptions" autocomplete="off" placeholder="例: 近所のスーパー">
              </label>

              <label>
                容量で検索
                <input id="volumeSearchInput" type="search" autocomplete="off" placeholder="例: 500ml / 30枚">
              </label>
            </div>
          </div>

          <div class="summary">
            <span id="countText">0件</span>
            <span id="filterText">すべてのカテゴリ</span>
          </div>


          <div id="list" class="list"></div>
        </div>
      </section>

      <section class="accordion-section" id="registerSection" aria-labelledby="form-title">
        <button class="accordion-header" aria-expanded="false" aria-controls="form-section-content">
          <span id="form-title">新規登録</span>
          <span class="accordion-indicator">▾</span>
        </button>

        <div class="accordion-content" id="form-section-content">
          <form id="priceForm" novalidate>
        <div class="form-grid">
          <label>
            カテゴリ
            <select id="category" required></select>
          </label>

              <label class="full">
                商品名
                <input id="productName" type="text" list="productNameOptions" autocomplete="off" placeholder="例: 食器用洗剤" required>
              </label>

              <label>
                仕様
                <input id="spec" type="text" list="specOptions" autocomplete="off" placeholder="例: 詰替">
              </label>

              <label>
                容量
                <input id="volume" type="text" autocomplete="off" placeholder="例: 500ml / 30枚" required>
              </label>

              <label>
                店舗
                <input id="storeName" type="text" list="storeNameOptions" autocomplete="organization" placeholder="例: 近所のスーパー" required>
              </label>

              <div class="price-group">
                <p class="price-group-title">【通常】</p>

                <label>
                  通常価格
                  <input id="normalPrice" type="text" inputmode="numeric" pattern="[1-9１-９][0-9０-９]*" placeholder="例: 298" required>
                </label>

                <label>
                  確認日
                  <input id="normalPriceDate" type="date" required>
                </label>
              </div>

              <label class="full checkbox-row">
                <input id="useSalePrice" type="checkbox">
                セール価格を登録する
              </label>

              <div class="price-group sale-fields" id="saleFields">
                <p class="price-group-title">【セール】</p>

                <label>
                  セール価格
                  <input id="salePrice" type="text" inputmode="numeric" pattern="[1-9１-９][0-9０-９]*" placeholder="例: 198">
                </label>

                <label>
                  確認日
                  <input id="salePriceDate" type="date">
                </label>
              </div>

            </div>

            <button type="submit">登録する</button>
            <button type="button" class="cancel-button" id="storeAddCancelButton" hidden>キャンセル</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <div class="detail-panel" id="detailPanel" aria-hidden="true">
    <div class="detail-box" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <div class="detail-head">
        <h2 id="detail-title">詳細編集</h2>
        <button class="close-button" id="closeDetailButton" type="button" aria-label="閉じる">×</button>
      </div>

      <form id="editForm" novalidate>
        <input id="editId" type="hidden">

        <div class="form-grid">
          <label>
            カテゴリ
            <select id="editCategory" required></select>
          </label>

          <label class="full">
            商品名
            <input id="editProductName" type="text" list="productNameOptions" autocomplete="off" required>
          </label>

          <label>
            仕様
            <input id="editSpec" type="text" list="specOptions" autocomplete="off">
          </label>

          <label>
            容量
            <input id="editVolume" type="text" autocomplete="off" required>
          </label>

          <label>
            店舗
            <input id="editStoreName" type="text" list="storeNameOptions" autocomplete="organization" required>
          </label>

          <div class="price-group">
            <p class="price-group-title">【通常】</p>

            <label>
              通常価格
              <input id="editNormalPrice" type="text" inputmode="numeric" pattern="[1-9１-９][0-9０-９]*" placeholder="例: 298" required>
            </label>

            <label>
              確認日
              <input id="editNormalPriceDate" type="date" required>
            </label>
          </div>

          <label class="full checkbox-row">
            <input id="editUseSalePrice" type="checkbox">
            セール価格を登録する
          </label>

          <div class="price-group sale-fields" id="editSaleFields">
            <p class="price-group-title">【セール】</p>

            <label>
              セール価格
              <input id="editSalePrice" type="text" inputmode="numeric" pattern="[1-9１-９][0-9０-９]*" placeholder="例: 198">
            </label>

            <label>
              確認日
              <input id="editSalePriceDate" type="date">
            </label>
          </div>
        </div>

        <div class="edit-actions">
          <button type="submit">保存する</button>
          <button class="detail-delete-button" id="detailDeleteButton" type="button">削除</button>
          <button class="cancel-button" id="cancelEditButton" type="button">閉じる</button>
        </div>
      </form>
    </div>
  </div>

  <datalist id="productNameOptions"></datalist>
  <datalist id="storeNameOptions"></datalist>
  <datalist id="specOptions"></datalist>

  <script>
    // HTMLから使う部品を取り出して、JavaScriptで操作できるようにします
    const form = document.getElementById("priceForm");
    const openSearchButton = document.getElementById("openSearchButton");
    const openFormButton = document.getElementById("openFormButton");
    const searchSection = document.getElementById("searchSection");
    const registerSection = document.getElementById("registerSection");
    const productNameInput = document.getElementById("productName");
    const categoryInput = document.getElementById("category");
    const specInput = document.getElementById("spec");
    const storeNameInput = document.getElementById("storeName");
    const normalPriceInput = document.getElementById("normalPrice");
    const normalPriceDateInput = document.getElementById("normalPriceDate");
    const useSalePriceInput = document.getElementById("useSalePrice");
    const saleFields = document.getElementById("saleFields");
    const salePriceInput = document.getElementById("salePrice");
    const salePriceDateInput = document.getElementById("salePriceDate");
    const volumeInput = document.getElementById("volume");
    const productSearchInput = document.getElementById("productSearchInput");
    const specSearchInput = document.getElementById("specSearchInput");
    const storeSearchInput = document.getElementById("storeSearchInput");
    const volumeSearchInput = document.getElementById("volumeSearchInput");
    const categoryFilter = document.getElementById("categoryFilter");
    const list = document.getElementById("list");
    const countText = document.getElementById("countText");
    const filterText = document.getElementById("filterText");
    const detailPanel = document.getElementById("detailPanel");
    const editForm = document.getElementById("editForm");
    const editIdInput = document.getElementById("editId");
    const editCategoryInput = document.getElementById("editCategory");
    const editProductNameInput = document.getElementById("editProductName");
    const editSpecInput = document.getElementById("editSpec");
    const editVolumeInput = document.getElementById("editVolume");
    const editStoreNameInput = document.getElementById("editStoreName");
    const editNormalPriceInput = document.getElementById("editNormalPrice");
    const editNormalPriceDateInput = document.getElementById("editNormalPriceDate");
    const editUseSalePriceInput = document.getElementById("editUseSalePrice");
    const editSaleFields = document.getElementById("editSaleFields");
    const editSalePriceInput = document.getElementById("editSalePrice");
    const editSalePriceDateInput = document.getElementById("editSalePriceDate");
    const closeDetailButton = document.getElementById("closeDetailButton");
    const detailDeleteButton = document.getElementById("detailDeleteButton");
    const cancelEditButton = document.getElementById("cancelEditButton");
    const storeAddCancelButton = document.getElementById("storeAddCancelButton");
    const formTitle = document.getElementById("form-title");
    const productNameOptions = document.getElementById("productNameOptions");
    const storeNameOptions = document.getElementById("storeNameOptions");
    const specOptions = document.getElementById("specOptions");

    // localStorageに保存すると、ブラウザを閉じても記録が残ります
    const storageKey = "dailyPriceRecords";
    const localUserId = "local-user";
    const defaultCategories = ["洗濯", "トイレ", "お風呂", "オーラル", "キッチン", "リビング", "薬"];
    let records = loadRecords();
    const categories = defaultCategories;
    const expandedGroups = new Set();
    let storeAddMode = false;
    let storeAddGroupKey = null;
    const categoryField = categoryInput.closest("label");
    const productNameField = productNameInput.closest("label");
    const specField = specInput.closest("label");
    const volumeField = volumeInput.closest("label");

    // Accordion: シンプルな開閉制御（モバイルファースト、可読性重視）
    (function initAccordions() {
      const sections = document.querySelectorAll('.accordion-section');

      function setContentHeight(content, open) {
        if (!content) return;
        if (open) {
          // 一旦最大値を設定してスムーズに開く
          content.style.maxHeight = content.scrollHeight + 'px';
          window.setTimeout(() => {
            if (content.closest(".accordion-section")?.classList.contains("is-open")) {
              content.style.maxHeight = "none";
            }
          }, 280);
        } else {
          if (content.style.maxHeight === "none") {
            content.style.maxHeight = content.scrollHeight + "px";
            content.offsetHeight;
          }
          content.style.maxHeight = '0';
        }
      }

      sections.forEach((section) => {
        const header = section.querySelector('.accordion-header');
        const content = section.querySelector('.accordion-content');
        if (!header || !content) return;

        const expanded = header.getAttribute('aria-expanded') === 'true';
        if (expanded) section.classList.add('is-open');
        setContentHeight(content, expanded);

        header.addEventListener('click', () => {
          const isOpen = section.classList.toggle('is-open');
          header.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
          setContentHeight(content, isOpen);

          if (isOpen) {
            const focusable = content.querySelector('input, select, textarea, button');
            if (focusable) focusable.focus();
          }
        });

        // ウィンドウリサイズ時に開いているコンテンツの高さを再計算
        window.addEventListener('resize', () => {
          if (section.classList.contains('is-open')) {
            content.style.maxHeight = "none";
          }
        });
      });
    })();

    function refreshOpenAccordions() {
      // 入力欄や一覧が増減しても、開いているアコーディオンをクリップしないようにします
      document.querySelectorAll(".accordion-section.is-open .accordion-content").forEach((content) => {
        content.style.maxHeight = "none";
      });
    }

    function openSectionAndScroll(section) {
      const header = section.querySelector(".accordion-header");
      const content = section.querySelector(".accordion-content");

      if (!header || !content) {
        return;
      }

      section.classList.add("is-open");
      header.setAttribute("aria-expanded", "true");
      content.style.maxHeight = content.scrollHeight + "px";

      window.setTimeout(() => {
        content.style.maxHeight = "none";
        section.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 120);
    }

    function updateSaleFields() {
      if (useSalePriceInput.checked) {
        saleFields.classList.add("is-open");

        if (salePriceDateInput.value === "") {
          salePriceDateInput.value = getTodayDateISO();
        }
      } else {
        saleFields.classList.remove("is-open");
        salePriceInput.value = "";
        salePriceDateInput.value = "";
      }

      requestAnimationFrame(refreshOpenAccordions);
    }

    function enterStoreAddMode(group) {
      storeAddMode = true;
      storeAddGroupKey = group.groupKey;

      categoryInput.value = group.category || categories[0];
      productNameInput.value = group.productName || "";
      specInput.value = group.spec || "";
      volumeInput.value = group.volume || "";
      storeNameInput.value = "";
      normalPriceInput.value = "";
      normalPriceDateInput.value = getTodayDateISO();
      useSalePriceInput.checked = false;
      salePriceInput.value = "";
      salePriceDateInput.value = getTodayDateISO();
      saleFields.classList.remove("is-open");

      categoryInput.disabled = true;
      categoryInput.classList.add("readonly-select");
      productNameInput.readOnly = true;
      productNameInput.classList.add("readonly-field");
      productNameInput.tabIndex = -1;
      specInput.readOnly = true;
      specInput.classList.add("readonly-field");
      specInput.tabIndex = -1;
      volumeInput.readOnly = true;
      volumeInput.classList.add("readonly-field");
      volumeInput.tabIndex = -1;

      form.querySelector("button[type='submit']").textContent = "保存する";
      storeAddCancelButton.hidden = false;
      formTitle.textContent = "店舗追加";
      openSectionAndScroll(registerSection);
      storeNameInput.focus();
    }

    function exitStoreAddMode() {
      storeAddMode = false;
      storeAddGroupKey = null;

      categoryInput.disabled = false;
      categoryInput.classList.remove("readonly-select");
      productNameInput.readOnly = false;
      productNameInput.classList.remove("readonly-field");
      productNameInput.tabIndex = 0;
      specInput.readOnly = false;
      specInput.classList.remove("readonly-field");
      specInput.tabIndex = 0;
      volumeInput.readOnly = false;
      volumeInput.classList.remove("readonly-field");
      volumeInput.tabIndex = 0;

      form.querySelector("button[type='submit']").textContent = "登録する";
      storeAddCancelButton.hidden = true;
      formTitle.textContent = "新規登録";
    }

    function normalizeText(value) {
      return String(value || "").trim().toLowerCase();
    }

    function findGroupByKey(groupKey) {
      return records.filter((record) => getRecordGroupKey(record) === groupKey);
    }

    function updateExistingStoreRecord(existingRecord) {
      existingRecord.storeName = storeNameInput.value.trim();
      existingRecord.normalPrice = normalizePrice(normalPriceInput.value);
      existingRecord.normalPriceDate = normalPriceDateInput.value;
      existingRecord.salePrice = useSalePriceInput.checked && salePriceInput.value !== "" ? normalizePrice(salePriceInput.value) : "";
      existingRecord.salePriceDate = useSalePriceInput.checked ? salePriceDateInput.value : "";
      existingRecord.updatedAt = getNowISO();
      existingRecord.updatedBy = localUserId;
    }

    function addStoreToGroup() {
      const group = findGroupByKey(storeAddGroupKey);
      if (group.length === 0) {
        return;
      }

      const storeNameValue = storeNameInput.value.trim();
      const existingRecord = group.find((record) => normalizeText(record.storeName) === normalizeText(storeNameValue));

      if (existingRecord) {
        const confirmed = window.confirm(`この店舗は既に登録されています。新規追加ではなく上書きしますか？`);
        if (!confirmed) {
          return false;
        }

        updateExistingStoreRecord(existingRecord);
        return true;
      }

      const createdAt = getNowISO();
      const newRecord = {
        id: createId(),
        productName: productNameInput.value.trim(),
        category: categoryInput.value,
        spec: specInput.value.trim(),
        storeName: storeNameValue,
        normalPrice: normalizePrice(normalPriceInput.value),
        normalPriceDate: normalPriceDateInput.value,
        salePrice: useSalePriceInput.checked && salePriceInput.value !== "" ? normalizePrice(salePriceInput.value) : "",
        salePriceDate: useSalePriceInput.checked ? salePriceDateInput.value : "",
        volume: normalizeVolume(volumeInput.value),
        createdAt,
        updatedAt: createdAt,
        createdBy: localUserId,
        updatedBy: localUserId
      };

      records.unshift(newRecord);
      return true;
    }

    function prepareNewRecordForm() {
      exitStoreAddMode();
      form.reset();
      normalPriceDateInput.value = getTodayDateISO();
      updateSaleFields();
      renderCategories(categoryInput.value, categoryFilter.value);
      productNameInput.focus();
    }

    function openStoreAdd(groupKey) {
      const group = findGroupByKey(groupKey);
      if (group.length === 0) {
        return;
      }

      enterStoreAddMode({
        groupKey,
        productName: group[0].productName || "",
        spec: group[0].spec || "",
        volume: group[0].volume || "",
        category: group[0].category || categories[0]
      });
    }

    function updateEditSaleFields() {
      if (editUseSalePriceInput.checked) {
        editSaleFields.classList.add("is-open");

        if (editSalePriceDateInput.value === "") {
          editSalePriceDateInput.value = getTodayDateISO();
        }
      } else {
        editSaleFields.classList.remove("is-open");
        editSalePriceInput.value = "";
        editSalePriceDateInput.value = "";
      }
    }

    // 通常価格の確認日は、新規登録時に今日の日付をセットします
    normalPriceDateInput.value = getTodayDateISO();
    updateSaleFields();

    function ensureUniqueRecordIds() {
      const usedIds = new Set();
      let changed = false;

      records.forEach((record) => {
        let id = record.id ? String(record.id) : "";

        if (id === "" || usedIds.has(id)) {
          id = createId();
          changed = true;
        }

        while (usedIds.has(id)) {
          id = createId();
          changed = true;
        }

        if (record.id !== id) {
          record.id = id;
          changed = true;
        }

        usedIds.add(id);
      });

      return changed;
    }

    function saveRecords() {
      ensureUniqueRecordIds();
      localStorage.setItem(storageKey, JSON.stringify(records));
    }

    function loadRecords() {
      try {
        const savedRecords = JSON.parse(localStorage.getItem(storageKey)) || [];
        return migrateRecords(Array.isArray(savedRecords) ? savedRecords : []);
      } catch (error) {
        return [];
      }
    }

    function getNowISO() {
      return new Date().toISOString();
    }

    function migrateRecords(savedRecords) {
      const usedIds = new Set();

      return savedRecords.map((record) => {
        const createdAt = record.createdAt || getNowISO();
        let id = record.id ? String(record.id) : "";

        if (id === "" || usedIds.has(id)) {
          id = createId();
        }

        while (usedIds.has(id)) {
          id = createId();
        }

        usedIds.add(id);

        return {
          ...record,
          id,
          normalPrice: record.normalPrice ?? "",
          normalPriceDate: record.normalPriceDate ?? "",
          salePrice: record.salePrice ?? "",
          salePriceDate: record.salePriceDate ?? "",
          createdAt,
          updatedAt: record.updatedAt || createdAt,
          createdBy: record.createdBy || localUserId,
          updatedBy: record.updatedBy || localUserId
        };
      });
    }

    saveRecords();

    function renderCategories(selectedCategory = categoryInput.value, selectedFilter = categoryFilter.value) {
      // カテゴリ選択欄を、保存済みカテゴリから作り直します
      categoryInput.innerHTML = categories.map((category) => {
        const safeCategory = escapeHtml(category);
        return `<option value="${safeCategory}">${safeCategory}</option>`;
      }).join("");

      editCategoryInput.innerHTML = categories.map((category) => {
        const safeCategory = escapeHtml(category);
        return `<option value="${safeCategory}">${safeCategory}</option>`;
      }).join("");

      categoryFilter.innerHTML = '<option value="すべて">すべて</option>' + categories.map((category) => {
        const safeCategory = escapeHtml(category);
        return `<option value="${safeCategory}">${safeCategory}</option>`;
      }).join("");

      categoryInput.value = categories.includes(selectedCategory) ? selectedCategory : categories[0];
      categoryFilter.value = selectedFilter === "すべて" || categories.includes(selectedFilter) ? selectedFilter : "すべて";
    }

    function getUniqueValues(key) {
      // recordsから空ではない値だけを取り出し、重複をなくして候補にします
      return [...new Set(records.map((record) => String(record[key] || "").trim()).filter(Boolean))];
    }

    function renderDatalist() {
      // iPhone Safariでも確認しやすいよう、標準のdatalistだけで補完候補を作ります
      const renderOptions = (values) => values.map((value) => {
        const safeValue = escapeHtml(value);
        return `<option value="${safeValue}"></option>`;
      }).join("");

      productNameOptions.innerHTML = renderOptions(getUniqueValues("productName"));
      storeNameOptions.innerHTML = renderOptions(getUniqueValues("storeName"));
      specOptions.innerHTML = renderOptions(getUniqueValues("spec"));
    }

    function openDetail(recordId) {
      const record = records.find((item) => item.id === recordId);

      if (!record) {
        return;
      }

      renderCategories(record.category || "キッチン", categoryFilter.value);
      editIdInput.value = record.id;
      editCategoryInput.value = record.category || "キッチン";
      editProductNameInput.value = record.productName || "";
      editSpecInput.value = record.spec || "";
      editVolumeInput.value = record.volume || "";
      editStoreNameInput.value = record.storeName || "";
      editNormalPriceInput.value = record.normalPrice || "";
      editNormalPriceDateInput.value = record.normalPriceDate || "";
      editUseSalePriceInput.checked = (record.salePrice !== "" && record.salePrice !== null && record.salePrice !== undefined) || Boolean(record.salePriceDate);
      editSalePriceInput.value = record.salePrice || "";
      editSalePriceDateInput.value = record.salePriceDate || "";
      editSaleFields.classList.toggle("is-open", editUseSalePriceInput.checked);
      detailPanel.classList.add("is-open");
      detailPanel.setAttribute("aria-hidden", "false");
      editProductNameInput.focus();
    }

    function closeDetail() {
      detailPanel.classList.remove("is-open");
      detailPanel.setAttribute("aria-hidden", "true");
      editForm.reset();
      editSaleFields.classList.remove("is-open");
    }

    function formatYen(number) {
      return Number(number).toLocaleString("ja-JP") + "円";
    }

    function getDaysAgo(dateText) {
      if (!dateText) {
        return null;
      }

      const today = new Date();
      const targetDate = new Date(`${dateText}T00:00:00`);

      if (Number.isNaN(targetDate.getTime())) {
        return null;
      }

      today.setHours(0, 0, 0, 0);
      return Math.floor((today - targetDate) / 86400000);
    }

    function formatDaysAgo(dateText) {
      const daysAgo = getDaysAgo(dateText);

      if (daysAgo === null) {
        return "-";
      }

      if (daysAgo <= 0) {
        return "今日";
      }

      return `${daysAgo}日前`;
    }

    function getDateClass(dateText) {
      const daysAgo = getDaysAgo(dateText);
      return daysAgo !== null && daysAgo >= 30 ? " old-price" : "";
    }

    function normalizeVolume(value) {
      // 容量だけ、保存時に全角英数字と全角スペースを半角へそろえます
      return String(value || "")
        .replace(/[０-９Ａ-Ｚａ-ｚ]/g, (char) => String.fromCharCode(char.charCodeAt(0) - 0xfee0))
        .replace(/　/g, " ")
        .trim();
    }

    function normalizePrice(value) {
      // 価格は全角数字を半角へそろえてから数値として保存します
      const normalizedValue = String(value || "")
        .replace(/[０-９]/g, (char) => String.fromCharCode(char.charCodeAt(0) - 0xfee0))
        .trim();

      return Number(normalizedValue);
    }

    function formatCapacityPerYen(volume, price) {
      // 容量は「500ml」「30枚」のような文字から数値と単位を取り出して計算します
      const match = String(volume || "").match(/^([0-9]+(?:\.[0-9]+)?)(.*)$/);
      const volumeNumber = match ? Number(match[1]) : NaN;
      const unit = match ? match[2].trim() : "";

      if (!Number.isFinite(volumeNumber) || !Number.isFinite(price) || price <= 0) {
        return "-";
      }

      const roundedValue = Math.round((volumeNumber / price) * 100) / 100;
      return `${roundedValue}${unit}/円`;
    }

    function createId() {
      // 古いブラウザでも動くように、randomUUIDが使えない時の予備を用意します
      if (typeof crypto !== "undefined" && crypto.randomUUID) {
        return crypto.randomUUID();
      }

      return Date.now().toString() + Math.random().toString(16).slice(2);
    }

    function getTodayDateISO() {
      const today = new Date();
      const year = today.getFullYear();
      const month = String(today.getMonth() + 1).padStart(2, "0");
      const day = String(today.getDate()).padStart(2, "0");
      return `${year}-${month}-${day}`;
    }

    function escapeHtml(text) {
      // 入力した文字にHTML記号があっても、表示が崩れないようにします
      return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function getRecordGroupKey(record) {
      return `${record.productName || ""}\u001f${record.spec || ""}\u001f${record.volume || ""}`;
    }

    function getProductTitle(productName, spec, volume) {
      return [productName, spec, volume]
        .filter((text) => text !== "")
        .join(" /");
    }

    function deleteProductGroup(groupKey) {
      records = records.filter((record) => getRecordGroupKey(record) !== groupKey);
      expandedGroups.delete(groupKey);
    }

    function deleteStoreRecord(recordId) {
      const record = records.find((item) => item.id === recordId);
      if (!record) {
        return null;
      }

      const groupKey = getRecordGroupKey(record);
      records = records.filter((item) => item.id !== recordId);
      return groupKey;
    }

    function groupRecords(targetRecords) {
      // 商品名・仕様・容量が同じ記録を、1つの商品グループとしてまとめます
      const groups = new Map();

      targetRecords.forEach((record) => {
        const productName = record.productName || "";
        const spec = record.spec || "";
        const volume = record.volume || "";
        const groupKey = `${productName}\u001f${spec}\u001f${volume}`;

        if (!groups.has(groupKey)) {
          groups.set(groupKey, {
            groupKey,
            productName,
            spec,
            volume,
            category: record.category || "キッチン",
            ids: [],
            stores: []
          });
        }

        const group = groups.get(groupKey);
        const normalPrice = Number(record.normalPrice);
        const salePrice = record.salePrice === "" ? NaN : Number(record.salePrice);
        group.ids.push(record.id);
        group.stores.push({
          id: record.id,
          storeName: record.storeName || "",
          normalPrice,
          normalPriceDate: record.normalPriceDate || "",
          salePrice,
          salePriceDate: record.salePriceDate || ""
        });
      });

      return Array.from(groups.values()).map((group) => {
        group.stores.sort((a, b) => a.normalPrice - b.normalPrice);
        return group;
      });
    }

    function renderRecords() {
      if (ensureUniqueRecordIds()) {
        saveRecords();
      }

      const productKeyword = productSearchInput.value.trim().toLowerCase();
      const specKeyword = specSearchInput.value.trim().toLowerCase();
      const storeKeyword = storeSearchInput.value.trim().toLowerCase();
      const volumeKeyword = volumeSearchInput.value.trim().toLowerCase();
      const selectedCategory = categoryFilter.value;

      // カテゴリと検索文字に合う記録だけを表示します
      const filteredRecords = records.filter((record) => {
        const category = record.category || "キッチン";
        const productName = String(record.productName || "").toLowerCase();
        const spec = String(record.spec || "").toLowerCase();
        const storeName = String(record.storeName || "").toLowerCase();
        const volume = String(record.volume || "").toLowerCase();
        const matchesCategory = selectedCategory === "すべて" || category === selectedCategory;
        const matchesProduct = productName.includes(productKeyword);
        const matchesSpec = spec.includes(specKeyword);
        const matchesStore = storeName.includes(storeKeyword);
        const matchesVolume = volume.includes(volumeKeyword);

        return matchesCategory && matchesProduct && matchesSpec && matchesStore && matchesVolume;
      });

      const groupedRecords = groupRecords(filteredRecords);

      countText.textContent = `${groupedRecords.length}商品 / ${filteredRecords.length}件`;
      filterText.textContent = selectedCategory === "すべて" ? "すべてのカテゴリ" : selectedCategory;

      if (groupedRecords.length === 0) {
        list.innerHTML = '<p class="empty">記録がありません</p>';
        requestAnimationFrame(refreshOpenAccordions);
        return;
      }

      list.innerHTML = groupedRecords.map((group) => {
          const firstId = group.stores[0].id;
        const safeGroupKey = encodeURIComponent(group.groupKey);
        const productName = escapeHtml(group.productName);
        const productTitle = [group.productName, group.spec, group.volume]
          .filter((text) => text !== "")
          .map((text) => escapeHtml(text))
          .join(" ");
        const category = escapeHtml(group.category);
        const spec = escapeHtml(group.spec || "-");
        const volume = escapeHtml(group.volume || "-");
        const normalPrices = group.stores.map((store) => store.normalPrice).filter(Number.isFinite);
        const salePrices = group.stores.map((store) => store.salePrice).filter(Number.isFinite);
        const lowestNormalPrice = normalPrices.length > 0 ? Math.min(...normalPrices) : 0;
        const lowestSalePrice = salePrices.length > 0 ? Math.min(...salePrices) : null;
        const lowestNormalStores = group.stores.filter((store) => store.normalPrice === lowestNormalPrice);
        const lowestSaleStores = lowestSalePrice === null ? [] : group.stores.filter((store) => store.salePrice === lowestSalePrice);
        const lowestNormalStoreNames = escapeHtml(lowestNormalStores.map((store) => store.storeName).join("、"));
        const lowestSaleStoreNames = escapeHtml(lowestSaleStores.map((store) => store.storeName).join("、"));
        const normalDateText = escapeHtml(formatDaysAgo(lowestNormalStores[0]?.normalPriceDate || ""));
        const saleDateText = escapeHtml(formatDaysAgo(lowestSaleStores[0]?.salePriceDate || ""));
        const normalDateClass = getDateClass(lowestNormalStores[0]?.normalPriceDate || "");
        const saleDateClass = getDateClass(lowestSaleStores[0]?.salePriceDate || "");
        const storeCount = group.stores.length;
        const capacityPerYen = escapeHtml(formatCapacityPerYen(group.volume, lowestNormalPrice));
        const isExpanded = expandedGroups.has(group.groupKey);
        const expandedClass = isExpanded ? " is-expanded" : "";
        const salePriceHtml = lowestSalePrice === null ? "" : `
          <div>
            <div class="price-line">セール最安 ${formatYen(lowestSalePrice)}（${lowestSaleStoreNames}）</div>
            <div class="price-date${saleDateClass}">${saleDateText}</div>
          </div>
        `;
        const storeRows = group.stores.map((store) => {
          const storeName = escapeHtml(store.storeName || "-");
          const normalDate = escapeHtml(formatDaysAgo(store.normalPriceDate || ""));
          const salePrice = Number.isFinite(store.salePrice) ? ` / セール ${formatYen(store.salePrice)}` : "";
          const saleDate = Number.isFinite(store.salePrice) ? ` / ${escapeHtml(formatDaysAgo(store.salePriceDate || ""))}` : "";

          return `
            <div class="store-row" role="button" tabindex="0" data-id="${store.id}" data-store-name="${escapeHtml(store.storeName || "")}" data-group-key="${safeGroupKey}">
              <span>${storeName} / ${normalDate}${saleDate}</span>
              <span class="store-price">通常 ${formatYen(store.normalPrice)}${salePrice}</span>
              <button class="store-delete-button" type="button" data-id="${store.id}" aria-label="${productName} の ${storeName} を削除">削除</button>
            </div>
          `;
        }).join("");

        return `
          <article class="item${expandedClass}" data-id="${firstId}" data-group-key="${safeGroupKey}" aria-expanded="${isExpanded}" tabindex="0">
            <div class="item-top">
              <div class="item-actions">
                <button class="store-add-button" type="button" data-group-key="${safeGroupKey}" aria-label="${productName} に店舗を追加">店舗追加</button>
                <button class="product-delete-button" type="button" data-group-key="${safeGroupKey}" aria-label="${productName} の商品を削除">商品削除</button>
              </div>
              <p class="product-name">${productTitle}</p>
              <div class="item-controls">
                <span class="category-badge">${category}</span>
                <div class="price-block">
                  <div>
                    <div class="price-line">通常最安 ${lowestNormalPrice > 0 ? formatYen(lowestNormalPrice) : "-"}（${lowestNormalStoreNames}）</div>
                    <div class="price-date${normalDateClass}">${normalDateText}</div>
                  </div>
                  ${salePriceHtml}
                </div>
              </div>
            </div>

            <div class="meta">
              <span>仕様: ${spec}</span>
              <span>容量: ${volume}</span>
              <span>${storeCount}店舗</span>
              <span class="capacity-per-yen">1円あたりの容量: ${capacityPerYen}</span>
            </div>

            <div class="store-list">${storeRows}</div>
          </article>
        `;
      }).join("");
      requestAnimationFrame(refreshOpenAccordions);
    }

    form.addEventListener("submit", (event) => {
      // フォーム送信時にページが再読み込みされないようにします
      event.preventDefault();

      if (!form.reportValidity()) {
        return;
      }

      if (storeAddMode) {
        const saved = addStoreToGroup();
        if (!saved) {
          return;
        }

        saveRecords();
        renderDatalist();
        renderRecords();
        storeNameInput.value = "";
        normalPriceInput.value = "";
        normalPriceDateInput.value = getTodayDateISO();
        useSalePriceInput.checked = false;
        salePriceInput.value = "";
        salePriceDateInput.value = "";
        saleFields.classList.remove("is-open");
        storeNameInput.focus();
        return;
      }

      const createdAt = getNowISO();
      const newRecord = {
        id: createId(),
        productName: productNameInput.value.trim(),
        category: categoryInput.value,
        spec: specInput.value.trim(),
        storeName: storeNameInput.value.trim(),
        normalPrice: normalizePrice(normalPriceInput.value),
        normalPriceDate: normalPriceDateInput.value,
        salePrice: useSalePriceInput.checked && salePriceInput.value !== "" ? normalizePrice(salePriceInput.value) : "",
        salePriceDate: useSalePriceInput.checked ? salePriceDateInput.value : "",
        volume: normalizeVolume(volumeInput.value),
        createdAt,
        updatedAt: createdAt,
        createdBy: localUserId,
        updatedBy: localUserId
      };

      records.unshift(newRecord);
      saveRecords();
      renderDatalist();
      renderRecords();

      const selectedCategory = categoryInput.value;
      form.reset();
      normalPriceDateInput.value = getTodayDateISO();
      updateSaleFields();
      renderCategories(selectedCategory, categoryFilter.value);
      productNameInput.focus();
    });

    productSearchInput.addEventListener("input", renderRecords);
    specSearchInput.addEventListener("input", renderRecords);
    storeSearchInput.addEventListener("input", renderRecords);
    volumeSearchInput.addEventListener("input", renderRecords);
    categoryFilter.addEventListener("change", renderRecords);
    openSearchButton.addEventListener("click", () => openSectionAndScroll(searchSection));
    openFormButton.addEventListener("click", () => {
      prepareNewRecordForm();
      openSectionAndScroll(registerSection);
    });
    storeAddCancelButton.addEventListener("click", () => {
      prepareNewRecordForm();
    });
    useSalePriceInput.addEventListener("change", updateSaleFields);
    editUseSalePriceInput.addEventListener("change", updateEditSaleFields);

    list.addEventListener("click", (event) => {
      if (event.target.matches(".store-delete-button")) {
        const recordId = event.target.dataset.id;
        const record = records.find((item) => item.id === recordId);

        if (!record) {
          return;
        }

        const productTitle = getProductTitle(record.productName, record.spec, record.volume);
        const storeName = record.storeName || "-";
        const confirmed = window.confirm(`店舗データを削除しますか？\n\n商品：\n${productTitle}\n\n店舗：\n${storeName}\n\n元に戻せません。`);

        if (!confirmed) {
          return;
        }

        const groupKey = deleteStoreRecord(recordId);
        if (groupKey) {
          const remainingGroupRecords = records.filter((item) => getRecordGroupKey(item) === groupKey);
          if (remainingGroupRecords.length === 0) {
            expandedGroups.delete(groupKey);
          }
        }

        saveRecords();
        renderDatalist();
        renderRecords();
        return;
      }

      if (event.target.matches(".store-add-button")) {
        openStoreAdd(decodeURIComponent(event.target.dataset.groupKey));
        return;
      }

      if (event.target.matches(".product-delete-button")) {
        const groupKey = decodeURIComponent(event.target.dataset.groupKey);
        const group = records.filter((record) => getRecordGroupKey(record) === groupKey);
        if (group.length === 0) {
          return;
        }

        const productTitle = getProductTitle(group[0].productName, group[0].spec, group[0].volume);
        const confirmed = window.confirm(`この商品を削除しますか？\n\n商品：\n${productTitle}\n\n削除対象：\n店舗データ ${group.length}件\n\n元に戻せません。`);

        if (!confirmed) {
          return;
        }

        deleteProductGroup(groupKey);
        saveRecords();
        renderDatalist();
        renderRecords();
        return;
      }

      if (event.target.closest(".store-row") && !event.target.matches(".store-delete-button")) {
        openDetail(event.target.closest(".store-row").dataset.id);
        return;
      }


      const item = event.target.closest(".item");

      if (!item) {
        return;
      }

      const groupKey = decodeURIComponent(item.dataset.groupKey);

      if (expandedGroups.has(groupKey)) {
        expandedGroups.delete(groupKey);
      } else {
        expandedGroups.add(groupKey);
      }

      renderRecords();
    });

    list.addEventListener("keydown", (event) => {
      if (event.target.matches(".store-row") && event.key === "Enter") {
        openDetail(event.target.dataset.id);
        return;
      }

      if (event.key !== "Enter") {
        return;
      }

      const item = event.target.closest(".item");

      if (item) {
        const groupKey = decodeURIComponent(item.dataset.groupKey);

        if (expandedGroups.has(groupKey)) {
          expandedGroups.delete(groupKey);
        } else {
          expandedGroups.add(groupKey);
        }

        renderRecords();
      }
    });

    editForm.addEventListener("submit", (event) => {
      event.preventDefault();

      if (!editForm.reportValidity()) {
        return;
      }

      const id = editIdInput.value;
      const record = records.find((item) => item.id === id);

      if (!record) {
        closeDetail();
        return;
      }

      record.category = editCategoryInput.value;
      record.productName = editProductNameInput.value.trim();
      record.spec = editSpecInput.value.trim();
      record.volume = normalizeVolume(editVolumeInput.value);
      record.storeName = editStoreNameInput.value.trim();
      record.normalPrice = normalizePrice(editNormalPriceInput.value);
      record.normalPriceDate = editNormalPriceDateInput.value;
      record.salePrice = editUseSalePriceInput.checked && editSalePriceInput.value !== "" ? normalizePrice(editSalePriceInput.value) : "";
      record.salePriceDate = editUseSalePriceInput.checked ? editSalePriceDateInput.value : "";
      record.id = record.id || createId();
      record.createdAt = record.createdAt || getNowISO();
      record.updatedAt = getNowISO();
      record.createdBy = record.createdBy || localUserId;
      record.updatedBy = localUserId;

      saveRecords();
      renderDatalist();
      renderRecords();
      closeDetail();
    });

    closeDetailButton.addEventListener("click", closeDetail);
    detailDeleteButton.addEventListener("click", () => {
      const recordId = editIdInput.value;
      const record = records.find((item) => item.id === recordId);

      if (!record) {
        closeDetail();
        return;
      }

      const productTitle = getProductTitle(record.productName, record.spec, record.volume);
      const storeName = record.storeName || "-";
      const confirmed = window.confirm(`店舗データを削除しますか？\n\n商品：\n${productTitle}\n\n店舗：\n${storeName}\n\n元に戻せません。`);

      if (!confirmed) {
        return;
      }

      const groupKey = deleteStoreRecord(recordId);
      if (groupKey) {
        const remainingGroupRecords = records.filter((item) => getRecordGroupKey(item) === groupKey);
        if (remainingGroupRecords.length === 0) {
          expandedGroups.delete(groupKey);
        }
      }

      saveRecords();
      renderDatalist();
      renderRecords();
      closeDetail();
    });
    cancelEditButton.addEventListener("click", closeDetail);

    detailPanel.addEventListener("click", (event) => {
      if (event.target === detailPanel) {
        closeDetail();
      }
    });

    renderCategories();
    renderDatalist();
    renderRecords();
  </script>
</body>
</html>
