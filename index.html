<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#2563eb">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="価格メモ">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="format-detection" content="telephone=no">
  <link rel="icon" type="image/png" href="icon.png">
  <link rel="apple-touch-icon" href="icon.png">
  <title>価格記録アプリ</title>
  <style>
    /* ページ全体の基本設定です */
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f5f7fa;
      color: #1f2937;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
      overscroll-behavior-y: none;
    }

    /* スマホで読みやすい横幅にしています */
    .app {
      width: min(100%, 720px);
      min-height: 100vh;
      min-height: 100dvh;
      margin: 0 auto;
      background: #ffffff;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
    }

    header {
      position: sticky;
      top: 0;
      z-index: 10;
      padding: calc(16px + env(safe-area-inset-top)) 18px 14px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      box-shadow: 0 1px 0 rgba(15, 23, 42, 0.04);
    }

    h1 {
      margin: 0;
      font-size: 22px;
      letter-spacing: 0;
    }

    .quick-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      margin-top: 12px;
    }

    .quick-action-button {
      min-height: 48px;
      padding: 0 12px;
      border: 1px solid #cbd5e1;
      background: #f8fafc;
      color: #1e40af;
      font-size: 15px;
      font-weight: 800;
    }

    .lead {
      margin: 4px 0 0;
      color: #6b7280;
      font-size: 14px;
    }

    main {
      padding: 16px 16px calc(28px + env(safe-area-inset-bottom));
    }

    section {
      margin-bottom: 20px;
      scroll-margin-top: 132px;
    }

    h2 {
      margin: 0 0 10px;
      font-size: 16px;
    }

    form,
    .search-area {
      display: grid;
      gap: 14px;
    }

    label {
      display: grid;
      gap: 7px;
      font-size: 14px;
      font-weight: 700;
    }

    input,
    select {
      width: 100%;
      min-height: 56px;
      padding: 14px;
      border: 1px solid #cbd5e1;
      border-radius: 8px;
      background: #ffffff;
      color: #111827;
      font-family: inherit;
      font-size: 16px;
    }

    input[type="checkbox"] {
      width: 24px;
      min-height: 24px;
      height: 24px;
      padding: 0;
      accent-color: #2563eb;
    }

    .checkbox-row {
      display: flex;
      align-items: center;
      gap: 10px;
      min-height: 56px;
      padding: 10px 0;
      font-size: 16px;
      font-weight: 800;
    }

    .checkbox-row input {
      flex: 0 0 auto;
    }

    .sale-fields {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.24s ease;
    }

    .sale-fields.is-open {
      max-height: 260px;
    }

    .price-group {
      grid-column: 1 / -1;
      display: grid;
      gap: 14px;
      padding: 14px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #f8fafc;
    }

    .price-group.sale-fields {
      gap: 0;
      padding-top: 0;
      padding-bottom: 0;
      border-width: 0;
      background: transparent;
    }

    .price-group.sale-fields.is-open {
      gap: 14px;
      padding: 14px;
      border-width: 1px;
      background: #f8fafc;
    }

    .price-group-title {
      margin: 0;
      color: #334155;
      font-size: 15px;
      font-weight: 800;
    }

    input:focus,
    select:focus {
      border-color: #2563eb;
      outline: 3px solid rgba(37, 99, 235, 0.18);
    }

    select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, #64748b 50%),
        linear-gradient(135deg, #64748b 50%, transparent 50%);
      background-position: calc(100% - 20px) 24px, calc(100% - 14px) 24px;
      background-repeat: no-repeat;
      background-size: 6px 6px, 6px 6px;
      padding-right: 42px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 14px;
    }

    .full {
      grid-column: 1 / -1;
    }

    button {
      min-height: 56px;
      border: 0;
      border-radius: 8px;
      background: #2563eb;
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
    }

    button:active {
      transform: translateY(1px);
    }

    .summary {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      margin-top: 12px;
      padding: 12px 14px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #f8fafc;
      color: #475569;
      font-size: 14px;
    }

    .filter-row {
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
    }

    .list {
      display: grid;
      gap: 12px;
      margin-top: 12px;
    }

    .item {
      padding: 16px;
      border: 1px solid #e5e7eb;
      border-radius: 8px;
      background: #ffffff;
      box-shadow: 0 1px 2px rgba(15, 23, 42, 0.04);
      cursor: pointer;
    }

    .item-top {
      display: flex;
      flex-wrap: wrap;
      align-items: flex-start;
      gap: 8px 10px;
    }

    .item-actions {
      display: flex;
      gap: 6px;
      order: -1;
    }

    .product-name {
      margin: 0;
      font-size: 18px;
      font-weight: 800;
      overflow-wrap: anywhere;
      flex: 1;
      min-width: 0;
    }

    .item-controls {
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 8px;
      min-width: fit-content;
    }

    .category-badge {
      display: inline-flex;
      align-items: center;
      min-height: 28px;
      padding: 4px 10px;
      border-radius: 999px;
      background: #ecfdf5;
      color: #047857;
      font-size: 13px;
      font-weight: 800;
      white-space: nowrap;
    }

    .store-add-button {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid #bfdbfe;
      border-radius: 999px;
      background: #eff6ff;
      color: #1d4ed8;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .store-add-button:active {
      transform: translateY(1px);
    }

    .stock-edit-button {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid #a7f3d0;
      border-radius: 999px;
      background: #ecfdf5;
      color: #047857;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .stock-edit-button:active {
      transform: translateY(1px);
    }

    .product-delete-button {
      min-height: 36px;
      padding: 0 12px;
      border: 1px solid #fecaca;
      border-radius: 999px;
      background: #fef2f2;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
      white-space: nowrap;
    }

    .product-delete-button:active {
      transform: translateY(1px);
    }

    .readonly-field,
    .readonly-select {
      background: #f8fafc;
      color: #334155;
      cursor: default;
    }

    .readonly-select {
      pointer-events: none;
    }

    select:disabled {
      background: #f8fafc;
      color: #334155;
      opacity: 1;
    }

    .price {
      grid-row: 1 / 3;
      grid-column: 3;
      align-self: start;
      min-width: fit-content;
      color: #0f766e;
      font-size: 20px;
      font-weight: 800;
    }

    .price-block {
      display: grid;
      gap: 6px;
      align-self: start;
      justify-items: end;
      min-width: fit-content;
    }

    .price-line {
      color: #0f766e;
      font-size: 18px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .old-price {
      color: #dc2626;
    }

    .meta {
      display: grid;
      grid-template-columns: 1fr;
      gap: 6px 10px;
      margin: 10px 0 0;
      color: #475569;
      font-size: 14px;
    }

    .store-list {
      display: grid;
      gap: 6px;
      max-height: 0;
      overflow: hidden;
      transition: max-height 0.25s ease, margin-top 0.25s ease;
    }

    .item.is-expanded .store-list {
      max-height: 900px;
      margin-top: 10px;
    }

    .store-row {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      gap: 6px 10px;
      align-items: center;
      min-height: 44px;
      padding: 8px 10px;
      border: 0;
      border-radius: 8px;
      background: #f8fafc;
      color: #475569;
      cursor: pointer;
      font-family: inherit;
      font-size: 14px;
      text-align: left;
    }

    .store-info {
      display: grid;
      gap: 4px;
      min-width: 0;
    }

    .store-name {
      color: #334155;
      font-weight: 800;
    }

    .store-row:focus-visible {
      outline: 3px solid rgba(37, 99, 235, 0.4);
      outline-offset: 2px;
    }

    .store-price {
      color: #0f766e;
      font-weight: 800;
    }

    .store-price-line {
      color: #0f766e;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .price-store-names {
      color: #475569;
      font-size: 13px;
      font-weight: 700;
      overflow-wrap: anywhere;
    }

    .stock-line {
      color: #1d4ed8;
      font-size: 14px;
      font-weight: 800;
      overflow-wrap: anywhere;
    }

    .store-delete-button {
      min-height: 34px;
      padding: 0 10px;
      border: 1px solid #fca5a5;
      border-radius: 8px;
      background: #fee2e2;
      color: #b91c1c;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .store-delete-button:active {
      transform: translateY(1px);
    }

    .delete-button {
      width: 100%;
      min-height: 48px;
      margin-top: 12px;
      background: #f1f5f9;
      color: #334155;
    }

    .detail-panel {
      position: fixed;
      inset: 0;
      z-index: 50;
      display: none;
      align-items: flex-end;
      background: rgba(15, 23, 42, 0.45);
      padding: 18px;
      padding-bottom: calc(18px + env(safe-area-inset-bottom));
    }

    .detail-panel.is-open {
      display: flex;
    }

    .detail-box {
      width: min(100%, 720px);
      max-height: min(88vh, 760px);
      margin: 0 auto;
      overflow: auto;
      border-radius: 8px;
      background: #ffffff;
      padding: 16px;
      box-shadow: 0 20px 40px rgba(15, 23, 42, 0.22);
    }

    .detail-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .detail-head h2 {
      margin: 0;
    }

    .close-button {
      width: 44px;
      min-height: 44px;
      border-radius: 8px;
      background: #f1f5f9;
      color: #334155;
      font-size: 22px;
      line-height: 1;
    }

    .edit-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      margin-top: 14px;
    }

    .edit-actions button {
      width: 100%;
      min-height: 56px;
    }

    .detail-delete-button {
      border: 0;
      border-radius: 8px;
      background: #dc2626;
      color: #ffffff;
      font-family: inherit;
      font-size: 16px;
      font-weight: 700;
      cursor: pointer;
    }

    .detail-delete-button:active {
      transform: translateY(1px);
    }

    .cancel-button {
      background: #f1f5f9;
      color: #334155;
    }

    .empty {
      padding: 24px 12px;
      border: 1px dashed #cbd5e1;
      border-radius: 8px;
      color: #64748b;
      text-align: center;
    }

    /* 広い画面では入力欄だけ2列にして、スマホでは1列のまま使いやすくします */
    @media (min-width: 640px) {
      .form-grid {
        grid-template-columns: 1fr 1fr;
      }

      .meta {
        grid-template-columns: 1fr 1fr;
      }
    }

    @media (max-width: 430px) {
      header,
      main {
        padding-left: 14px;
        padding-right: 14px;
      }

      h1 {
        font-size: 20px;
      }

      .lead {
        font-size: 13px;
      }

      .summary {
        align-items: flex-start;
        flex-direction: column;
        gap: 2px;
      }

      .detail-panel {
        padding-left: 10px;
        padding-right: 10px;
      }

      .edit-actions {
        grid-template-columns: 1fr;
      }

      .item-top {
        flex-direction: column;
      }

      .item-actions {
        width: 100%;
        order: -1;
      }

      .item-controls {
        width: 100%;
        align-items: flex-start;
      }

    }

    @media (max-width: 390px) {
      .item {
        padding: 14px;
      }

      .item-top {
        grid-template-columns: auto 1fr;
      }

      .price {
        grid-row: auto;
        grid-column: 2;
        font-size: 19px;
      }

      .price-block {
        grid-row: auto;
        grid-column: 2;
        justify-items: start;
      }

      .category-badge {
        grid-column: 2;
      }
    }

    /* Accordion (mobile-first, minimal) */
    .accordion-section {
      border-radius: 8px;
      overflow: visible;
    }

    .accordion-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 58px;
      padding: 16px 18px;
      font-size: 16px;
      font-weight: 800;
      color: #0f172a;
      background: #e2e8f0;
      border: 1px solid #cbd5e1;
      border-radius: 12px;
      text-align: left;
      cursor: pointer;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      transition: background 180ms ease, border-color 180ms ease;
    }

    .accordion-section.is-open .accordion-header {
      background: #dbeafe;
      border-color: #bfdbfe;
    }

    .accordion-header:focus {
      outline: 3px solid rgba(37,99,235,0.18);
      border-radius: 12px;
    }

    .accordion-content {
      overflow: hidden;
      max-height: 0;
      transition: max-height 260ms ease, padding 260ms ease;
      padding: 0 0;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      border-top: 0;
      border-radius: 0 0 12px 12px;
    }

    .accordion-indicator {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 34px;
      height: 34px;
      margin-left: 14px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.7);
      color: #334155;
      font-size: 22px;
      line-height: 1;
      transition: transform 200ms ease, background 180ms ease;
    }

    .accordion-section:not(.is-open) .accordion-indicator {
      transform: rotate(-90deg);
    }

    .accordion-content {
      overflow: hidden;
      max-height: 0;
      transition: max-height 260ms ease, padding 260ms ease;
      padding: 0 0;
    }

    .accordion-section.is-open .accordion-content {
      overflow: visible;
      padding-top: 12px;
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <h1>価格記録アプリ</h1>
      <div class="quick-actions" aria-label="よく使う操作">
        <button class="quick-action-button" id="openSearchButton" type="button">検索を開く</button>
        <button class="quick-action-button" id="openFormButton" type="button">新規登録を開く</button>
      </div>
    </header>

    <main>
      <section class="accordion-section is-open" id="searchSection" aria-labelledby="list-title">
        <button class="accordion-header" aria-expanded="true" aria-controls="list-section-content">
          <span id="list-title">検索一覧表示</span>
          <span class="accordion-indicator">▾</span>
        </button>

        <div class="accordion-content" id="list-section-content">
          <div class="search-area">
            <div class="filter-row">
              <label>
                カテゴリで絞り込み
                <select id="categoryFilter">
                </select>
              </label>

              <label>
                商品名で検索
                <input id="productSearchInput" type="search" list="productNameOptions" autocomplete="off" placeholder="例: 洗剤">
              </label>

              <label>
                仕様で検索
                <input id="specSearchInput" type="search" list="specOptions" autocomplete="off" placeholder="例: 詰替">
              </label>

              <label>
                店舗で検索
                <input id="storeSearchInput" type="search" list="storeNameOptions" autocomplete="off" placeholder="例: 近所のスーパー">
              </label>

              <label>
                容量で検索
                <input id="volumeSearchInput" type="search" autocomplete="off" placeholder="例: 500ml / 30枚">
              </label>
            </div>
          </div>

          <div class="summary">
            <span id="countText">0件</span>
            <span id="filterText">すべてのカテゴリ</span>
          </div>


          <div id="list" class="list"></div>
        </div>
      </section>

      <section class="accordion-section" id="registerSection" aria-labelledby="form-title">
        <button class="accordion-header" aria-expanded="false" aria-controls="form-section-content">
          <span id="form-title">新規登録</span>
          <span class="accordion-indicator">▾</span>
        </button>

        <div class="accordion-content" id="form-section-content">
          <form id="priceForm" novalidate>
        <div class="form-grid">
          <label>
            カテゴリ
            <select id="category" required></select>
          </label>

              <label class="full">
                商品名
                <input id="productName" type="text" list="productNameOptions" autocomplete="off" placeholder="例: 食器用洗剤" required>
              </label>

              <label>
                仕様
                <input id="spec" type="text" list="specOptions" autocomplete="off" placeholder="例: 詰替">
              </label>

              <label>
                容量
                <input id="volume" type="text" autocomplete="off" placeholder="例: 500ml / 30枚" required>
              </label>

              <label>
                在庫数
                <input id="stockCount" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="例: 2">
              </label>

              <label>
                在庫数登録日
                <input id="stockDate" type="date">
              </label>

              <label>
                店舗
                <input id="storeName" type="text" list="storeNameOptions" autocomplete="organization" placeholder="例: 近所のスーパー" required>
              </label>

              <div class="price-group">
                <p class="price-group-title">【通常】</p>

                <label>
                  通常価格
                  <input id="normalPrice" type="text" inputmode="numeric" pattern="[1-9１-９][0-9０-９]*" placeholder="例: 298" required>
                </label>

                <label>
                  確認日
                  <input id="normalPriceDate" type="date" required>
                </label>
              </div>

              <label class="full checkbox-row">
                <input id="useSalePrice" type="checkbox">
                セール価格を登録する
              </label>

              <div class="price-group sale-fields" id="saleFields">
                <p class="price-group-title">【セール】</p>

                <label>
                  セール価格
                  <input id="salePrice" type="text" inputmode="numeric" pattern="[1-9１-９][0-9０-９]*" placeholder="例: 198">
                </label>

                <label>
                  確認日
                  <input id="salePriceDate" type="date">
                </label>
              </div>

            </div>

            <button type="submit">登録する</button>
            <button type="button" class="cancel-button" id="storeAddCancelButton" hidden>キャンセル</button>
          </form>
        </div>
      </section>
    </main>
  </div>

  <div class="detail-panel" id="detailPanel" aria-hidden="true">
    <div class="detail-box" role="dialog" aria-modal="true" aria-labelledby="detail-title">
      <div class="detail-head">
        <h2 id="detail-title">詳細編集</h2>
        <button class="close-button" id="closeDetailButton" type="button" aria-label="閉じる">×</button>
      </div>

      <form id="editForm" novalidate>
        <input id="editId" type="hidden">

        <div class="form-grid">
          <label>
            カテゴリ
            <select id="editCategory" required></select>
          </label>

          <label class="full">
            商品名
            <input id="editProductName" type="text" list="productNameOptions" autocomplete="off" required>
          </label>

          <label>
            仕様
            <input id="editSpec" type="text" list="specOptions" autocomplete="off">
          </label>

          <label>
            容量
            <input id="editVolume" type="text" autocomplete="off" required>
          </label>

          <label>
            店舗
            <input id="editStoreName" type="text" list="storeNameOptions" autocomplete="organization" required>
          </label>

          <div class="price-group">
            <p class="price-group-title">【通常】</p>

            <label>
              通常価格
              <input id="editNormalPrice" type="text" inputmode="numeric" pattern="[1-9１-９][0-9０-９]*" placeholder="例: 298" required>
            </label>

            <label>
              確認日
              <input id="editNormalPriceDate" type="date" required>
            </label>
          </div>

          <label class="full checkbox-row">
            <input id="editUseSalePrice" type="checkbox">
            セール価格を登録する
          </label>

          <div class="price-group sale-fields" id="editSaleFields">
            <p class="price-group-title">【セール】</p>

            <label>
              セール価格
              <input id="editSalePrice" type="text" inputmode="numeric" pattern="[1-9１-９][0-9０-９]*" placeholder="例: 198">
            </label>

            <label>
              確認日
              <input id="editSalePriceDate" type="date">
            </label>
          </div>
        </div>

        <div class="edit-actions">
          <button type="submit">保存する</button>
          <button class="detail-delete-button" id="detailDeleteButton" type="button">削除</button>
          <button class="cancel-button" id="cancelEditButton" type="button">閉じる</button>
        </div>
      </form>
    </div>
  </div>

  <div class="detail-panel" id="stockPanel" aria-hidden="true">
    <div class="detail-box" role="dialog" aria-modal="true" aria-labelledby="stock-title">
      <div class="detail-head">
        <h2 id="stock-title">在庫変更</h2>
        <button class="close-button" id="closeStockButton" type="button" aria-label="閉じる">×</button>
      </div>

      <form id="stockForm" novalidate>
        <input id="stockGroupKey" type="hidden">

        <div class="form-grid">
          <label>
            在庫数
            <input id="stockModalCountInput" type="text" inputmode="numeric" pattern="[0-9]*" autocomplete="off" placeholder="例: 2">
          </label>

          <label>
            在庫登録日
            <input id="stockModalDateInput" type="date">
          </label>
        </div>

        <div class="edit-actions">
          <button type="submit">保存</button>
          <button class="cancel-button" id="cancelStockButton" type="button">キャンセル</button>
        </div>
      </form>
    </div>
  </div>

  <datalist id="productNameOptions"></datalist>
  <datalist id="storeNameOptions"></datalist>
  <datalist id="specOptions"></datalist>

  <script type="module" src="./app.js"></script>
</body>
</html>
